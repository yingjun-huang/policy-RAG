[project]
name = "policy-rag"
version = "0.1.0"
description = "E-Commerce Policy Intelligent QA System with Adaptive Self-RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.12.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
    "networkx>=3.2.0",
    "sse-starlette>=2.0.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "sentence-transformers>=3.0.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_rag*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
