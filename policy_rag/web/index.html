<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy-RAG · 电商售后政策问答</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #202123;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --canvas: #fff;
      --sidebar: #f9f9f9;
      --surface: #fff;
      --surface-hover: #ececec;
      --surface-active: #e9e9e9;
      --bubble: #f3f3f3;
      --text: #202123;
      --muted: #737373;
      --border: #e5e5e5;
      --soft-border: #ececec;
      --primary: #1f1f1f;
      --primary-text: #fff;
      --accent: #0b8f77;
      --accent-soft: #e9f7f3;
      --shadow: 0 10px 40px rgba(0, 0, 0, .08);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #212121;
      --sidebar: #171717;
      --surface: #303030;
      --surface-hover: #2b2b2b;
      --surface-active: #303030;
      --bubble: #303030;
      --text: #ececec;
      --muted: #a0a0a0;
      --border: #414141;
      --soft-border: #363636;
      --primary: #f5f5f5;
      --primary-text: #171717;
      --accent: #5ccbb3;
      --accent-soft: #183e36;
      --shadow: 0 12px 46px rgba(0, 0, 0, .25);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { min-width: 320px; background: var(--canvas); color: var(--text); }
    button, textarea, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    ::selection { background: rgba(11, 143, 119, .18); }

    .app-shell { display: flex; height: 100dvh; overflow: hidden; background: var(--canvas); }
    .sidebar {
      width: 264px;
      flex: 0 0 264px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--soft-border);
      transition: width .2s ease, flex-basis .2s ease;
      overflow: hidden;
    }
    .app-shell.sidebar-collapsed .sidebar { width: 0; flex-basis: 0; border-right: 0; }
    .sidebar-top {
      height: 64px;
      padding: 14px 14px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }
    .icon-button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .icon-button:hover { background: var(--surface-hover); color: var(--text); }
    .sidebar-actions { padding: 6px 10px 14px; display: grid; gap: 2px; flex: 0 0 auto; }
    .sidebar-action {
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      background: transparent;
      border: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-align: left;
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap;
    }
    .sidebar-action:hover, .sidebar-footer-button:hover { background: var(--surface-hover); }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #1e1e1e;
      color: #fff;
      flex: 0 0 auto;
    }
    .brand-mark-small { width: 28px; height: 28px; border-radius: 50%; }
    :root[data-theme="dark"] .brand-mark { background: #f3f3f3; color: #1e1e1e; }

    .conversation-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 10px 18px;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }
    .conversation-list:hover { scrollbar-color: #bbb transparent; }
    .conversation-group { margin: 6px 0 18px; }
    .conversation-group h2 {
      margin: 0 10px 6px;
      font-size: 11px;
      line-height: 20px;
      font-weight: 600;
      color: var(--muted);
    }
    .conversation-row { min-width: 0; display: flex; align-items: center; border-radius: 9px; position: relative; }
    .conversation-row:hover { background: var(--surface-hover); }
    .conversation-row.selected { background: var(--surface-active); }
    .conversation-select {
      min-width: 0;
      height: 36px;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: transparent;
      border: 0;
      text-align: left;
      color: var(--text);
      font-size: 13px;
    }
    .conversation-select span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .conversation-delete {
      display: none;
      width: 28px;
      height: 28px;
      margin-right: 4px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
    }
    .conversation-row:hover .conversation-delete { display: inline-flex; }
    .conversation-delete:hover { background: var(--surface); color: #dc5252; }

    .sidebar-footer {
      flex: 0 0 auto;
      padding: 10px 10px 14px;
      border-top: 1px solid var(--soft-border);
    }
    .sidebar-footer-button {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      font-size: 13px;
    }
    .profile-row {
      margin-top: 6px;
      min-height: 46px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 9px;
      white-space: nowrap;
    }
    .profile-row > div { display: grid; gap: 1px; flex: 1; min-width: 0; }
    .profile-row strong { font-size: 13px; font-weight: 600; }
    .profile-row small { color: var(--muted); font-size: 11px; }
    .profile-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0e9279;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    .main-panel { min-width: 0; flex: 1; display: flex; flex-direction: column; background: var(--canvas); }
    .topbar {
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 20px;
    }
    .open-sidebar { display: none; }
    .app-shell.sidebar-collapsed .open-sidebar { display: inline-flex; }
    .model-title { padding: 6px 8px; color: var(--text); font-weight: 650; font-size: 16px; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .date-select {
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--soft-border);
      background: var(--sidebar);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      color: var(--muted);
      background: var(--sidebar);
      border: 1px solid var(--soft-border);
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .connection-pill > span.dot {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #16a085;
      box-shadow: 0 0 0 3px rgba(22, 160, 133, .14);
    }
    .connection-pill.offline > span.dot {
      background: #d66161;
      box-shadow: 0 0 0 3px rgba(214, 97, 97, .14);
    }

    .welcome {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 24px 0;
      overflow-y: auto;
    }
    .welcome-inner { width: min(680px, 100%); margin-top: -28px; text-align: center; }
    .welcome-inner > .brand-mark { width: 46px; height: 46px; border-radius: 14px; margin: 0 auto 20px; }
    .welcome h1 { margin: 0; font-size: clamp(24px, 3vw, 30px); font-weight: 640; letter-spacing: -.03em; }
    .welcome p { margin: 10px 0 34px; color: var(--muted); font-size: 14px; }
    .suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .suggestions button {
      min-height: 70px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: left;
      color: var(--text);
      transition: border-color .15s, background .15s, transform .15s;
    }
    .suggestions button:hover { background: var(--sidebar); border-color: #c8c8c8; transform: translateY(-1px); }
    .suggestions button > span.s-body { display: grid; min-width: 0; gap: 3px; flex: 1; }
    .suggestions strong { font-size: 13px; font-weight: 600; }
    .suggestions small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .chat-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .message-list { max-width: 780px; min-height: 100%; margin: 0 auto; padding: 24px 24px 48px; }
    .message { display: flex; margin-bottom: 28px; }
    .user-message { justify-content: flex-end; margin-bottom: 28px; }
    .user-bubble {
      max-width: min(76%, 600px);
      padding: 10px 16px;
      border-radius: 20px;
      background: var(--bubble);
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .assistant-message { align-items: flex-start; gap: 14px; }
    .assistant-avatar { padding-top: 2px; flex: 0 0 auto; }
    .assistant-body { min-width: 0; flex: 1; padding-top: 1px; }

    .markdown { font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }
    .markdown p { margin: 0 0 12px; }
    .markdown h1, .markdown h2, .markdown h3 { line-height: 1.35; margin: 18px 0 8px; }
    .markdown h1 { font-size: 19px; }
    .markdown h2 { font-size: 16px; }
    .markdown h3 { font-size: 14px; }
    .markdown ul, .markdown ol { padding-left: 22px; margin: 0 0 12px; }
    .markdown li { margin: 3px 0; }
    .markdown code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--bubble);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .markdown table { border-collapse: collapse; display: block; overflow-x: auto; margin: 12px 0; font-size: 13px; }
    .markdown th, .markdown td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .markdown th { background: var(--sidebar); }
    .message-error { color: #c95656; }

    .thinking-wrap { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; height: 28px; }
    .thinking { display: flex; align-items: center; gap: 4px; }
    .thinking span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .thinking span:nth-child(2) { animation-delay: .15s; }
    .thinking span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: .3; transform: scale(.7); }
      40% { opacity: 1; transform: scale(1); }
    }

    .citation-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin: 10px 0 8px;
    }
    .citation-heading { margin-right: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .citation {
      max-width: 260px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 5px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color .15s, background .15s;
    }
    .citation:hover, .citation.active { border-color: var(--accent); background: var(--accent-soft); }
    .citation > span:last-child { overflow: hidden; text-overflow: ellipsis; }
    .citation-index {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 650;
      font-size: 11px;
      flex: 0 0 auto;
    }
    .citation-drawer {
      margin: 6px 0 10px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--sidebar);
      font-size: 12px;
      line-height: 1.65;
      color: var(--text);
    }
    .citation-drawer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .citation-drawer-body {
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }

    .message-tools { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .message-tools button {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
    }
    .message-tools button:hover { background: var(--surface-hover); color: var(--text); }

    .composer-wrap { width: min(780px, 100%); padding: 0 24px 16px; margin: 0 auto; flex: 0 0 auto; }
    .composer {
      padding: 10px 13px 10px 18px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--surface);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .045);
    }
    .composer:focus-within { border-color: #bfbfbf; box-shadow: 0 3px 18px rgba(0, 0, 0, .07); }
    .composer textarea {
      width: 100%;
      min-height: 28px;
      max-height: 160px;
      display: block;
      resize: none;
      padding: 4px 0 0;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      overflow-y: auto;
    }
    .composer textarea::placeholder { color: #979797; }
    .composer-bottom { height: 36px; display: flex; align-items: flex-end; justify-content: space-between; }
    .composer-hint { padding: 0 0 4px 0; color: var(--muted); font-size: 11px; }
    .send-button {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
    }
    .send-button:hover:not(:disabled) { opacity: .82; }
    .send-button:disabled { opacity: .25; }
    .composer-disclaimer { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: 11px; }

    .dialog-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: flex-start;
      padding: min(16vh, 140px) 18px 18px;
      background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(2px);
    }
    .dialog-backdrop.open { display: flex; }
    .dialog-card {
      width: min(520px, 100%);
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--canvas);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .dialog-search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--soft-border);
    }
    .dialog-search-row input {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .dialog-results { max-height: 300px; overflow-y: auto; padding: 8px; }
    .dialog-item {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      text-align: left;
      display: grid;
      gap: 2px;
    }
    .dialog-item:hover { background: var(--surface-hover); }
    .dialog-item small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    @media (max-width: 820px) {
      .sidebar { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; }
      .suggestions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="appShell" class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <button id="collapseBtn" class="icon-button" type="button" title="收起侧边栏" aria-label="收起侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <button id="topNewBtn" class="icon-button" type="button" title="新对话" aria-label="新对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button id="newChatBtn" class="sidebar-action" type="button">
          <span class="brand-mark brand-mark-small">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
          </span>
          <span>新对话</span>
        </button>
        <button id="searchChatBtn" class="sidebar-action" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-left:5px;color:var(--muted)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>搜索对话</span>
        </button>
      </div>

      <div id="conversationList" class="conversation-list"></div>

      <div class="sidebar-footer">
        <button id="themeToggleBtn" class="sidebar-footer-button" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span id="themeLabel">深色模式</span>
        </button>
        <div class="profile-row">
          <span class="profile-avatar">P</span>
          <div>
            <strong>Policy-RAG</strong>
            <small>电商售后政策顾问</small>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button id="openSidebarBtn" class="icon-button open-sidebar" type="button" title="展开侧边栏" aria-label="展开侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div class="model-title">Policy-RAG</div>
        <div class="topbar-right">
          <select id="asOfSelect" class="date-select" title="政策查询基准时点">
            <option value="">现行政策</option>
            <option value="2024-06-01">2024-06-01 规则</option>
            <option value="2022-01-01">2022-01-01 历史</option>
          </select>
          <div id="connPill" class="connection-pill" title="服务连接状态">
            <span class="dot"></span>
            <span id="connText">正在连接</span>
          </div>
        </div>
      </header>

      <section id="welcomeView" class="welcome">
        <div class="welcome-inner">
          <div class="brand-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
          </div>
          <h1>有什么售后政策可以帮您？</h1>
          <p>支持退换货资格核对、偏远运费计价、历史版本对比与条款溯源</p>
          <div class="suggestions">
            <button type="button" data-q="已激活的手机还能七天无理由退货吗？如果卖家拒绝怎么处理？">
              <span class="s-body">
                <strong>手机激活与纠纷举证</strong>
                <small>已激活的手机还能七天无理由退货吗？如果卖家拒绝怎么处理？</small>
              </span>
            </button>
            <button type="button" data-q="买的京东生鲜车厘子收到后部分腐烂坏果，需要退回商品吗？怎么赔？">
              <span class="s-body">
                <strong>生鲜腐损与优鲜赔</strong>
                <small>买的京东生鲜车厘子收到后部分腐烂坏果，需要退回商品吗？</small>
              </span>
            </button>
            <button type="button" data-q="2023年之前的自营免运费门槛和现在相比有什么变化？">
              <span class="s-body">
                <strong>历史与现行规则对比</strong>
                <small>2023年之前的自营免运费门槛和现在相比有什么变化？</small>
              </span>
            </button>
            <button type="button" data-q="新疆西藏买京东自营商品，偏远地区运费怎么算？重量加收标准是什么？">
              <span class="s-body">
                <strong>偏远地区运费核算</strong>
                <small>新疆西藏买京东自营商品，偏远地区运费怎么算？</small>
              </span>
            </button>
          </div>
        </div>
      </section>

      <section id="chatContent" class="chat-content" style="display:none;">
        <div id="messageList" class="message-list" aria-label="对话内容"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="queryInput" rows="1" placeholder="询问任何售后政策问题"></textarea>
          <div class="composer-bottom">
            <span class="composer-hint">Shift + Enter 换行</span>
            <button id="sendBtn" class="send-button" type="button" title="发送" aria-label="发送">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-disclaimer">Policy-RAG 基于售后政策条款检索生成，点击引用来源可查看对应原文。</p>
      </div>
    </main>
  </div>

  <div id="searchDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-label="搜索对话">
    <div class="dialog-card">
      <div class="dialog-search-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="搜索历史对话..." />
      </div>
      <div id="searchResults" class="dialog-results"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "policy_rag_conversations_v1";
    const THEME_KEY = "policy_rag_theme_v1";

    const appShell = document.getElementById("appShell");
    const welcomeView = document.getElementById("welcomeView");
    const chatContent = document.getElementById("chatContent");
    const messageList = document.getElementById("messageList");
    const conversationList = document.getElementById("conversationList");
    const queryInput = document.getElementById("queryInput");
    const sendBtn = document.getElementById("sendBtn");
    const asOfSelect = document.getElementById("asOfSelect");
    const connPill = document.getElementById("connPill");
    const connText = document.getElementById("connText");
    const themeLabel = document.getElementById("themeLabel");
    const searchDialog = document.getElementById("searchDialog");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");

    let conversations = loadConversations();
    let activeId = conversations[0]?.id || createConversation().id;
    let isBusy = false;

    function uid() {
      return "conv_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    function loadConversations() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveConversations() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
      } catch { /* ignore storage quota errors */ }
    }

    function createConversation() {
      const conv = {
        id: uid(),
        title: "新对话",
        updatedAt: Date.now(),
        messages: [],
      };
      conversations.unshift(conv);
      saveConversations();
      return conv;
    }

    function getActiveConversation() {
      let conv = conversations.find((c) => c.id === activeId);
      if (!conv) {
        conv = conversations[0] || createConversation();
        activeId = conv.id;
      }
      return conv;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderInlineMarkdown(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
      out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return out;
    }

    function renderMarkdown(mdText) {
      const lines = String(mdText || "").replace(/\r\n/g, "\n").split("\n");
      const html = [];
      let inUl = false;
      let inOl = false;
      let tableRows = [];

      function closeLists() {
        if (inUl) { html.push("</ul>"); inUl = false; }
        if (inOl) { html.push("</ol>"); inOl = false; }
      }

      function flushTable() {
        if (!tableRows.length) return;
        const rows = tableRows.filter((r) => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
        if (rows.length) {
          html.push("<table>");
          rows.forEach((row, idx) => {
            const cells = row.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
            const tag = idx === 0 ? "th" : "td";
            if (idx === 0) html.push("<thead>");
            if (idx === 1) html.push("<tbody>");
            html.push("<tr>" + cells.map((c) => `<${tag}>${renderInlineMarkdown(c)}</${tag}>`).join("") + "</tr>");
            if (idx === 0) html.push("</thead>");
          });
          if (rows.length > 1) html.push("</tbody>");
          html.push("</table>");
        }
        tableRows = [];
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (line.startsWith("|")) {
          closeLists();
          tableRows.push(line);
          continue;
        }
        flushTable();

        if (!line) {
          closeLists();
          continue;
        }
        const hMatch = line.match(/^(#{1,3})\s+(.*)$/);
        if (hMatch) {
          closeLists();
          const lvl = hMatch[1].length;
          html.push(`<h${lvl}>${renderInlineMarkdown(hMatch[2])}</h${lvl}>`);
          continue;
        }
        const ulMatch = line.match(/^[-*•]\s+(.*)$/);
        if (ulMatch) {
          if (inOl) { html.push("</ol>"); inOl = false; }
          if (!inUl) { html.push("<ul>"); inUl = true; }
          html.push(`<li>${renderInlineMarkdown(ulMatch[1])}</li>`);
          continue;
        }
        const olMatch = line.match(/^\d+[.)]\s+(.*)$/);
        if (olMatch) {
          if (inUl) { html.push("</ul>"); inUl = false; }
          if (!inOl) { html.push("<ol>"); inOl = true; }
          html.push(`<li>${renderInlineMarkdown(olMatch[1])}</li>`);
          continue;
        }
        closeLists();
        html.push(`<p>${renderInlineMarkdown(line)}</p>`);
      }
      flushTable();
      closeLists();
      return html.join("");
    }

    function renderSidebar() {
      const nonEmpty = conversations.filter((c) => c.messages.length > 0 || c.id === activeId);
      const todayStart = new Date();
      todayStart.setHours(0, 0, 0, 0);
      const todayItems = nonEmpty.filter((c) => c.updatedAt >= todayStart.getTime());
      const olderItems = nonEmpty.filter((c) => c.updatedAt < todayStart.getTime());

      conversationList.innerHTML = "";
      function appendGroup(label, items) {
        if (!items.length) return;
        const group = document.createElement("div");
        group.className = "conversation-group";
        group.innerHTML = `<h2>${label}</h2>`;
        for (const conv of items) {
          const row = document.createElement("div");
          row.className = "conversation-row" + (conv.id === activeId ? " selected" : "");

          const selectBtn = document.createElement("button");
          selectBtn.type = "button";
          selectBtn.className = "conversation-select";
          selectBtn.innerHTML = `<span>${escapeHtml(conv.title || "新对话")}</span>`;
          selectBtn.onclick = () => {
            if (isBusy) return;
            activeId = conv.id;
            renderAll();
          };

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "conversation-delete";
          delBtn.title = "删除";
          delBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>`;
          delBtn.onclick = (e) => {
            e.stopPropagation();
            if (isBusy) return;
            conversations = conversations.filter((c) => c.id !== conv.id);
            if (!conversations.length) {
              activeId = createConversation().id;
            } else if (activeId === conv.id) {
              activeId = conversations[0].id;
            }
            saveConversations();
            renderAll();
          };

          row.appendChild(selectBtn);
          row.appendChild(delBtn);
          group.appendChild(row);
        }
        conversationList.appendChild(group);
      }

      appendGroup("今天", todayItems);
      appendGroup("更早", olderItems);
    }

    function dedupeCitations(citations, evidence) {
      const evMap = new Map((evidence || []).map((e) => [e.chunk_id, e]));
      const seen = new Set();
      const items = [];
      for (const cite of citations || []) {
        if (seen.has(cite.chunk_id)) continue;
        seen.add(cite.chunk_id);
        const ev = evMap.get(cite.chunk_id);
        items.push({
          ...cite,
          content: ev?.content || "",
          doc_slug: (ev?.metadata && ev.metadata.logical_doc_id) || cite.document_id.replace(/_[a-f0-9]{8}$/i, ""),
        });
      }
      return items;
    }

    function renderMessages() {
      const conv = getActiveConversation();
      if (!conv.messages.length) {
        welcomeView.style.display = "flex";
        chatContent.style.display = "none";
        return;
      }
      welcomeView.style.display = "none";
      chatContent.style.display = "block";
      messageList.innerHTML = "";

      for (const msg of conv.messages) {
        const row = document.createElement("div");
        if (msg.role === "user") {
          row.className = "message user-message";
          row.innerHTML = `<div class="user-bubble">${escapeHtml(msg.content)}</div>`;
          messageList.appendChild(row);
          continue;
        }

        row.className = "message assistant-message";
        const avatar = document.createElement("div");
        avatar.className = "assistant-avatar";
        avatar.innerHTML = `<span class="brand-mark brand-mark-small"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg></span>`;

        const body = document.createElement("div");
        body.className = "assistant-body";

        if (msg.content) {
          const md = document.createElement("div");
          md.className = "markdown" + (msg.state === "error" ? " message-error" : "");
          md.innerHTML = renderMarkdown(msg.content);
          body.appendChild(md);
        } else {
          const wait = document.createElement("div");
          wait.className = "thinking-wrap";
          wait.innerHTML = `<div class="thinking"><span></span><span></span><span></span></div><span>${escapeHtml(msg.statusText || "正在检索政策条款...")}</span>`;
          body.appendChild(wait);
        }

        if (msg.state === "complete") {
          const cites = dedupeCitations(msg.citations, msg.evidence);
          if (cites.length) {
            const citeBar = document.createElement("div");
            citeBar.className = "citation-list";
            citeBar.innerHTML = `<span class="citation-heading">来源</span>`;

            const drawer = document.createElement("div");
            drawer.className = "citation-drawer";
            drawer.style.display = "none";

            cites.forEach((cite, idx) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "citation";
              btn.title = `${cite.title}${cite.section ? " · " + cite.section : ""}`;
              const label = cite.section ? `${cite.doc_slug} · ${cite.section}` : cite.title;
              btn.innerHTML = `<span class="citation-index">${idx + 1}</span><span>${escapeHtml(label)}</span>`;
              btn.onclick = () => {
                const already = btn.classList.contains("active");
                citeBar.querySelectorAll(".citation").forEach((el) => el.classList.remove("active"));
                if (already) {
                  drawer.style.display = "none";
                  return;
                }
                btn.classList.add("active");
                drawer.style.display = "block";
                drawer.innerHTML = `
                  <div class="citation-drawer-head">
                    <strong>${escapeHtml(cite.title)}${cite.section ? " · " + escapeHtml(cite.section) : ""}</strong>
                    <span>${escapeHtml(cite.chunk_id)}</span>
                  </div>
                  <div class="citation-drawer-body">${escapeHtml(cite.content || "（该引用条款已通过校验）")}</div>
                `;
              };
              citeBar.appendChild(btn);
            });
            body.appendChild(citeBar);
            body.appendChild(drawer);
          }

          const tools = document.createElement("div");
          tools.className = "message-tools";
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.title = "复制回答";
          copyBtn.setAttribute("aria-label", "复制回答");
          const copyIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          const checkIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          copyBtn.innerHTML = copyIcon;
          copyBtn.onclick = async () => {
            try {
              await navigator.clipboard.writeText(msg.content);
              copyBtn.innerHTML = checkIcon;
              setTimeout(() => { copyBtn.innerHTML = copyIcon; }, 1600);
            } catch { /* ignore clipboard failure */ }
          };
          tools.appendChild(copyBtn);
          body.appendChild(tools);
        }

        row.appendChild(avatar);
        row.appendChild(body);
        messageList.appendChild(row);
      }

      chatContent.scrollTop = chatContent.scrollHeight;
    }

    function renderAll() {
      renderSidebar();
      renderMessages();
      syncSendButton();
    }

    function syncSendButton() {
      sendBtn.disabled = isBusy || !queryInput.value.trim();
    }

    function autoResizeTextarea() {
      queryInput.style.height = "auto";
      queryInput.style.height = Math.min(queryInput.scrollHeight, 160) + "px";
    }

    const NODE_STATUS_LABELS = {
      guardrail: "正在核查合规边界...",
      router: "正在识别咨询意图...",
      retrieve_and_grade: "正在检索与核对政策条款...",
      generate: "正在整理政策依据...",
      faithfulness: "正在校验条款引用...",
    };

    async function sendMessage(text) {
      const query = String(text || "").trim();
      if (!query || isBusy) return;

      const conv = getActiveConversation();
      const historyPayload = conv.messages
        .filter((m) => m.state === "complete" || m.role === "user")
        .slice(-10)
        .map((m) => ({ role: m.role, content: m.content }));

      if (!conv.messages.length) {
        conv.title = query.slice(0, 24);
      }
      conv.updatedAt = Date.now();
      conv.messages.push({ role: "user", content: query });

      const assistantMsg = {
        role: "assistant",
        content: "",
        state: "streaming",
        statusText: "正在检索政策条款...",
        citations: [],
        evidence: [],
      };
      conv.messages.push(assistantMsg);

      queryInput.value = "";
      autoResizeTextarea();
      isBusy = true;
      renderAll();

      const asOfVal = asOfSelect.value;
      const bodyPayload = {
        message: query,
        session_id: conv.id,
        history: historyPayload,
        policy_context: asOfVal ? { as_of: asOfVal } : null,
      };

      try {
        const resp = await fetch("/api/v1/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyPayload),
        });
        if (!resp.ok || !resp.body) {
          throw new Error(`HTTP ${resp.status}`);
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let currentEvent = "message";
        let dataLines = [];

        function dispatchEvent() {
          if (!dataLines.length) return;
          const payload = JSON.parse(dataLines.join("\n"));
          dataLines = [];
          const evt = currentEvent;
          currentEvent = "message";

          if (evt === "node_update" && payload.node && NODE_STATUS_LABELS[payload.node]) {
            assistantMsg.statusText = NODE_STATUS_LABELS[payload.node];
            renderMessages();
          } else if (evt === "token" && typeof payload.delta === "string") {
            assistantMsg.content += payload.delta;
            renderMessages();
          } else if (evt === "done") {
            assistantMsg.content = payload.answer || assistantMsg.content;
            assistantMsg.citations = payload.citations || [];
            assistantMsg.evidence = payload.evidence || [];
            assistantMsg.state = "complete";
            renderAll();
          } else if (evt === "error") {
            assistantMsg.content = "请求处理失败：" + (payload.error || "未知错误");
            assistantMsg.state = "error";
            renderAll();
          }
        }

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() ?? "";
          for (const rawLine of lines) {
            if (rawLine === "") {
              dispatchEvent();
            } else if (rawLine.startsWith("event:")) {
              currentEvent = rawLine.slice(6).trim();
            } else if (rawLine.startsWith("data:")) {
              dataLines.push(rawLine.slice(5).trim());
            }
          }
        }
        dispatchEvent();
        if (assistantMsg.state === "streaming") {
          assistantMsg.state = "complete";
        }
      } catch (err) {
        assistantMsg.content = `服务调用异常（${err.message}），请确认后端服务已正常启动。`;
        assistantMsg.state = "error";
      } finally {
        isBusy = false;
        conv.updatedAt = Date.now();
        saveConversations();
        renderAll();
      }
    }

    async function probeCapabilities() {
      try {
        const res = await fetch("/api/v1/capabilities");
        if (!res.ok) throw new Error("not ok");
        const caps = await res.json();
        connPill.classList.remove("offline");
        connText.textContent = caps.degraded ? "已连接 (降级)" : "已连接";
      } catch {
        connPill.classList.add("offline");
        connText.textContent = "未连接";
      }
    }

    function applyTheme(theme) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        themeLabel.textContent = "浅色模式";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeLabel.textContent = "深色模式";
      }
      localStorage.setItem(THEME_KEY, theme);
    }

    function openSearch() {
      searchDialog.classList.add("open");
      searchInput.value = "";
      renderSearchResults("");
      setTimeout(() => searchInput.focus(), 20);
    }

    function renderSearchResults(q) {
      const kw = q.trim().toLowerCase();
      const matched = conversations.filter((c) => {
        if (!c.messages.length) return false;
        if (!kw) return true;
        return (c.title || "").toLowerCase().includes(kw) ||
          c.messages.some((m) => m.content.toLowerCase().includes(kw));
      });
      searchResults.innerHTML = matched.length
        ? ""
        : `<div style="padding:18px;text-align:center;color:var(--muted);font-size:13px;">没有匹配的对话记录</div>`;
      for (const conv of matched) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dialog-item";
        const preview = conv.messages[conv.messages.length - 1]?.content || "";
        btn.innerHTML = `<strong>${escapeHtml(conv.title)}</strong><small>${escapeHtml(preview.slice(0, 60))}</small>`;
        btn.onclick = () => {
          activeId = conv.id;
          searchDialog.classList.remove("open");
          renderAll();
        };
        searchResults.appendChild(btn);
      }
    }

    // Event bindings
    document.getElementById("collapseBtn").onclick = () => appShell.classList.add("sidebar-collapsed");
    document.getElementById("openSidebarBtn").onclick = () => appShell.classList.remove("sidebar-collapsed");

    function startNewChat() {
      if (isBusy) return;
      const existingEmpty = conversations.find((c) => c.messages.length === 0);
      activeId = existingEmpty ? existingEmpty.id : createConversation().id;
      renderAll();
      queryInput.focus();
    }
    document.getElementById("newChatBtn").onclick = startNewChat;
    document.getElementById("topNewBtn").onclick = startNewChat;

    document.getElementById("searchChatBtn").onclick = openSearch;
    searchInput.oninput = () => renderSearchResults(searchInput.value);
    searchDialog.onclick = (e) => {
      if (e.target === searchDialog) searchDialog.classList.remove("open");
    };
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && searchDialog.classList.contains("open")) {
        searchDialog.classList.remove("open");
      }
    });

    document.getElementById("themeToggleBtn").onclick = () => {
      const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      applyTheme(current === "dark" ? "light" : "dark");
    };

    document.querySelectorAll(".suggestions button").forEach((btn) => {
      btn.onclick = () => sendMessage(btn.getAttribute("data-q"));
    });

    queryInput.addEventListener("input", () => {
      autoResizeTextarea();
      syncSendButton();
    });
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(queryInput.value);
      }
    });
    sendBtn.onclick = () => sendMessage(queryInput.value);

    // Initialize
    applyTheme(localStorage.getItem(THEME_KEY) || "light");
    renderAll();
    probeCapabilities();
  </script>
</body>
</html>
